<script>
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  const passwordIcon = document.getElementById('password-icon');

  if (toggleBtn && passwordInput && passwordIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      passwordIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      passwordInput.classList.toggle('tracking-widest', !isPassword);
    });
  }

  const bioBtn = document.getElementById('biometric-btn');
  if (bioBtn) {
    bioBtn.addEventListener('click', () => {
      bioBtn.classList.add('bg-primary-fixed');
      setTimeout(() => {
        bioBtn.classList.remove('bg-primary-fixed');
      }, 400);
    });
  }
